<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing you in… | Voyager Analytics</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="auth-container" style="text-align:center;">
    <div>
        <div style="display:inline-block; width:32px; height:32px; border:3px solid rgba(255,255,255,0.15); border-top-color:#00d4ff; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:16px;"></div>
        <p style="color:var(--muted);">Signing you in…</p>
    </div>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get("token");

    if(token){
        localStorage.setItem("token", token);
        const redirectTo = localStorage.getItem("voyager_post_oauth_redirect");
        localStorage.removeItem("voyager_post_oauth_redirect");
        window.location.href = redirectTo || "dashboard/dashboard.html";
    } else {
        window.location.href = "auth.html?error=google_failed";
    }
</script>
</body>
</html>
